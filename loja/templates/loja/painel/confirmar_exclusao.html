{% extends "loja/painel/base_painel.html" %}

{% block titulo_pagina %}Confirmar exclusão{% endblock %}

{% block conteudo %}
<div class="card border-0 shadow-sm rounded-4" style="max-width: 40rem;">
  <div class="card-body">
    <h1 class="h5">Confirmar exclusão</h1>
    <p class="mb-2">Deseja realmente excluir <strong>{{ objeto }}</strong>? Esta ação não pode ser desfeita.</p>
    {% if aviso %}<div class="alert alert-warning py-2 small">{{ aviso }}</div>{% endif %}
    <form method="post" class="d-flex gap-2">
      {% csrf_token %}
      <button class="btn btn-danger">Excluir</button>
      <a class="btn btn-hd-outline" href="{% url voltar %}">Cancelar</a>
    </form>
  </div>
</div>
{% endblock %}
