{% extends "loja/painel/base_painel.html" %}

{% block titulo_pagina %}{{ titulo }}{% endblock %}

{% block conteudo %}
<h1 class="h4 mb-4">{{ titulo }}</h1>
<div class="card border-0 shadow-sm rounded-4">
  <div class="card-body">
    <form method="post" enctype="multipart/form-data" novalidate>
      {% csrf_token %}
      {% include "loja/painel/_campos_form.html" with form=form %}
      <div class="d-flex gap-2 mt-3">
        <button class="btn btn-hd">Salvar</button>
        <a class="btn btn-hd-outline" href="{% if voltar_arg %}{% url voltar voltar_arg %}{% else %}{% url voltar %}{% endif %}">Cancelar</a>
      </div>
    </form>
  </div>
</div>
{% endblock %}
