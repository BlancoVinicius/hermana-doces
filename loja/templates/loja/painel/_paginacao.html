{% if pagina.paginator.num_pages > 1 %}
<nav aria-label="Paginação">
  <ul class="pagination pagination-sm">
    {% if pagina.has_previous %}
      <li class="page-item"><a class="page-link" href="?page={{ pagina.previous_page_number }}{{ filtros }}">Anterior</a></li>
    {% endif %}
    <li class="page-item disabled"><span class="page-link">Página {{ pagina.number }} de {{ pagina.paginator.num_pages }}</span></li>
    {% if pagina.has_next %}
      <li class="page-item"><a class="page-link" href="?page={{ pagina.next_page_number }}{{ filtros }}">Próxima</a></li>
    {% endif %}
  </ul>
</nav>
{% endif %}
