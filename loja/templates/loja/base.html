{% load static %}<!doctype html>
<html lang="pt-br">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block titulo %}Hermana Doces{% endblock %}</title>
  <meta name="description" content="{% block descricao %}Hermana Doces - bolos, doces e cestas feitos artesanalmente.{% endblock %}">
  <link rel="icon" href="{% static 'img/hermana-logo.png' %}" type="image/png">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="{% static 'css/hermana.css' %}" rel="stylesheet">
  {% block head_extra %}{% endblock %}
</head>
<body class="d-flex flex-column min-vh-100">
  {% block corpo %}{% endblock %}
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  {% block scripts %}{% endblock %}
</body>
</html>
